<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - To-Do Web App</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <div class="app">

        <!-- HEADER -->
        <header class="header">
            <div>
                <p class="welcome">MY TASK MANAGER</p>
                <h1>TaskFlow</h1>
                <p class="subtitle">
                    Organize your day, one task at a time.
                </p>
            </div>
        </header>

        <!-- ADD TASK -->
        <section class="add-task-card">

            <form id="taskForm">

                <div class="input-wrapper">
                    <input
                        type="text"
                        id="taskInput"
                        placeholder="What do you need to do?"
                        autocomplete="off"
                    >

                    <button type="submit" class="add-btn">
                        + Add Task
                    </button>
                </div>

                <p id="errorMessage" class="error-message"></p>

            </form>

        </section>

        <!-- STATISTICS -->
        <section class="stats">

            <div class="stat-card">
                <span class="stat-number" id="totalCount">0</span>
                <span class="stat-label">Total Tasks</span>
            </div>

            <div class="stat-card">
                <span class="stat-number" id="pendingCount">0</span>
                <span class="stat-label">Pending</span>
            </div>

            <div class="stat-card">
                <span class="stat-number" id="completedCount">0</span>
                <span class="stat-label">Completed</span>
            </div>

        </section>

        <!-- FILTERS -->
        <section class="task-section">

            <div class="section-header">

                <div>
                    <h2>My Tasks</h2>
                    <p>Manage your daily tasks</p>
                </div>

                <div class="filters">

                    <button
                        class="filter-btn active"
                        data-filter="all">
                        All
                    </button>

                    <button
                        class="filter-btn"
                        data-filter="pending">
                        Pending
                    </button>

                    <button
                        class="filter-btn"
                        data-filter="completed">
                        Completed
                    </button>

                </div>

            </div>

            <!-- TASK LIST -->
            <div id="taskList" class="task-list"></div>

            <!-- EMPTY STATE -->
            <div id="emptyState" class="empty-state">

                <div class="empty-icon">✓</div>

                <h3 id="emptyTitle">
                    No tasks yet
                </h3>

                <p id="emptyText">
                    Add your first task and start organizing your day.
                </p>

            </div>

        </section>

        <!-- FOOTER -->
        <footer>
            <p>
                Oasis Infobyte Web Development Internship —
                Level 2, Task 3
            </p>
        </footer>

    </div>

    <!-- EDIT MODAL -->
    <div id="editModal" class="modal">

        <div class="modal-content">

            <button id="closeModal" class="close-btn">
                ×
            </button>

            <h2>Edit Task</h2>

            <input
                type="text"
                id="editInput"
                placeholder="Edit your task"
            >

            <button id="saveEdit" class="save-btn">
                Save Changes
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
